name: 🔒 Security Audit

on:
  push:
    branches: [ main, master, develop, production/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install --global npm@11.12.1 --ignore-scripts
        npm ci --ignore-scripts

    - name: Run npm audit
      run: |
        echo "🔍 Running npm audit..."
        npm audit --audit-level=moderate
      continue-on-error: false

    - name: Run security linting
      run: |
        echo "🔍 Running ESLint security rules on production files..."
        npx eslint simple-backend.js src/ backend/telegramBot.js
      continue-on-error: false

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run TruffleHog OSS
      uses: trufflesecurity/trufflehog@c85580b712841eda4c53bc28fc6ace6100e8c16c # v3.99.4
      with:
        path: ./
        version: 3.99.4
        extra_args: --no-verification

    - name: Custom secret patterns scan
      run: |
        echo "🔍 Scanning for common secret patterns..."
        
        # Check for API keys and tokens in production files only (exclude environment variable references)
        if grep -r -l -i -E "(api_key|secret|password|token|private_key)\s*[=:]\s*['\"][a-zA-Z0-9]{25,}['\"]" . \
          --exclude-dir=node_modules \
          --exclude-dir=.git \
          --exclude-dir=dist \
          --exclude="*.log" \
          --exclude="package-lock.json" \
          --exclude="test-*.js" \
          --exclude="*test*.js" \
          --exclude="verify-deployment.js" \
          --exclude="docs/**" \
          --exclude="config/**"; then
          echo "❌ Potential hard-coded secrets found!"
          exit 1
        fi
        
        # Check for .env files in repository
        if [ -n "$(git ls-files -- '.env' '**/.env')" ]; then
          echo "❌ .env files found in repository!"
          exit 1
        fi
        
        echo "✅ No secrets detected"

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install --global npm@11.12.1 --ignore-scripts
        npm ci --ignore-scripts

    - name: Audit the separate backend lockfile
      run: |
        npm --prefix backend ci --ignore-scripts
        npm --prefix backend audit --audit-level=moderate

  code-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:javascript"

  security-headers:
    name: Dormant Boundary and Build Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install --global npm@11.12.1 --ignore-scripts
        npm ci --ignore-scripts

    - name: Prepare the reviewed SQLite native dependency only
      run: npm run prepare:sqlite

    - name: Verify dormant boundaries and existing security headers offline
      run: npm run test:security

    - name: Build and verify private provider configuration stays out of the browser
      run: npm run check:client-secrets

  report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [security-audit, secret-scan, dependency-check, code-analysis, security-headers]
    if: always()
    
    steps:
    - name: Generate Security Report
      run: |
        echo "## 🔒 Security Audit Report" >> security-report.md
        echo "### Date: $(date)" >> security-report.md
        echo "### Repository: ${{ github.repository }}" >> security-report.md
        echo "### Commit: ${{ github.sha }}" >> security-report.md
        echo "" >> security-report.md
        
        # Job status summary
        echo "### Job Status:" >> security-report.md
        echo "- Security Audit: ${{ needs.security-audit.result }}" >> security-report.md
        echo "- Secret Scan: ${{ needs.secret-scan.result }}" >> security-report.md
        echo "- Dependency Check: ${{ needs.dependency-check.result }}" >> security-report.md
        echo "- Code Analysis: ${{ needs.code-analysis.result }}" >> security-report.md
        echo "- Security Headers: ${{ needs.security-headers.result }}" >> security-report.md
        
        if [[ "${{ needs.security-audit.result }}" == "success" && 
              "${{ needs.secret-scan.result }}" == "success" && 
              "${{ needs.security-headers.result }}" == "success" ]]; then
          echo "✅ **Overall Status: PASS**" >> security-report.md
        else
          echo "❌ **Overall Status: FAIL**" >> security-report.md
        fi

    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.md